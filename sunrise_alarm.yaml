blueprint:
  name: Sunrise Alarm Blueprint
  description: Make a light slowly turn on in the morning to wake up naturally
  domain: automation

  input:
    alarm_light:
      name: Lights
      description: The lights to use for the alarm.
      selector:
        target:
          entity:
            - domain: light

    time_entity:
      name: Alarm Time
      description: What time the alarm should be finished at
      selector:
        entity:
          filter:
            - domain: input_datetime
            - domain: sensor
              device_class: timestamp

    conditions:
      name: Conditions for alarm
      description: All conditions needs to pass for the alarm to run
      default: []
      selector:
        condition: {}

    sunrise_start:
      name: Sunrise start
      description: When the sunrise should start in comparison to the alarm time (Should be a negative number)
      default: "-00:30:00"
      selector:
        text:

    max_brightness:
      name: Max brightness
      description: The maximum brightness that should have been reached when the alarm goes off
      default: 100
      selector:
        number:
          min: 0
          max: 100

    post_alarm_actions:
      name: Post alarm actions
      description: Actions to execute after the sunrise alarm is finished
      default: []
      selector:
        action: {}

    color_start:
      name: Color start value
      description: The color to start fading from, most likely a warm color that is less noticeable
      default: [255, 0, 0]
      selector:
        color_rgb:

    color_end:
      name: Color end value
      description: The final color the light takes on when the alarm goes off
      default: [255, 196, 137]
      selector:
        color_rgb:

    transition_time:
      name: Transition time
      description: The time under witch the lights should fade between states
      default: 30
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds

    update_frequency:
      name: Update frequency
      description: How long it should be between light state updates
      default: 30
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds

    brightness_curve:
      name: Brightness curve
      description: |
        define a custom brightness curve, use 'progress' [0,1] to calculate another value in range
        [0,1], this value will be used for brightness control
      default: "{{ ((progress | float) ** 2 * 3 - (progress | float) ** 3 * 2) | float }}"
      selector:
        template:

    color_curve:
      name: Color curve
      description: |
        define a custom color curve, use 'progress' [0,1] to calculate another value in range
        [0,1], this value will be used color interpolation between start and end colors
      default: "{{ ((progress | float) ** 2 * 3 - (progress | float) ** 3 * 2) | float }}"
      selector:
        template:

triggers:
  - at:
      entity_id: !input time_entity
      offset: !input sunrise_start
    trigger: time
conditions:
  condition: and
  conditions: !input conditions
actions:
  - variables:
      max_brightness: !input max_brightness
      brightness_value: 0
      rgb_start: !input color_start
      rgb_end: !input color_end
      target_light: !input alarm_light
      wake_time_entity: !input time_entity

      entity: "{{ states(wake_time_entity) }}"
      domain: "{{ wake_time_entity.split('.')[0] }}"
      timestamp_value: >
        {% set state_val = entity %}
        {% if domain == 'sensor' %}
          {{ as_timestamp(state_val) }}
        {% elif domain == 'input_datetime' %}
          {% if ' ' in state_val %}
            {{ as_timestamp(state_val) }}
          {% else %}
            {# time-only input_datetime: combine with next occurrence #}
            {% set now_dt = now() %}
            {% set today_dt = now_dt.replace(
                hour=state_val.split(':')[0]|int,
                minute=state_val.split(':')[1]|int,
                second=0, microsecond=0
            ) %}
            {{ as_timestamp(today_dt if today_dt > now_dt else today_dt + timedelta(days=1)) }}
          {% endif %}
        {% else %}
          0
        {% endif %}
      time_stamp_duration: !input sunrise_start
      duration: >
        {% set parts = time_stamp_duration.split(":") %}
        {{ (parts[0]|int|abs)*3600 + (parts[1]|int)*60 + (parts[2]|int) }}

      progress: >
        {{ (1 - (timestamp_value - as_timestamp(now())) / duration) | round(3) | float}}
      last_light_update: >-
        {{ [states[target_light.entity_id].attributes.brightness,
        states[target_light.entity_id].attributes.rgb_color] }}

  - variables:
      brightness_value: !input brightness_curve
      color_value: !input color_curve

  - repeat:
      until:
        - condition: or
          conditions:
            - condition: time
              after: !input time_entity
            - condition: template
              value_template: >
                {{ last_light_update !=
                [states[target_light.entity_id].attributes.brightness,
                states[target_light.entity_id].attributes.rgb_color]}}
              enabled: true
      sequence:
        - variables:
            progress: >
              {{ (1 - (timestamp_value - as_timestamp(now())) / duration) | round(3) | float}}

        - variables:
            brightness_value: !input brightness_curve
            color_value: !input color_curve

        - variables:
            brightness_procent: >-
              {{ max((brightness_value | float) * (max_brightness | float), 1)
              }}
            rgb_value: >-
              {{
                [
                  rgb_start[0] + color_value | float * (rgb_end[0] - rgb_start[0]) | int,
                  rgb_start[1] + color_value | float * (rgb_end[1] - rgb_start[1]) | int,
                  rgb_start[2] + color_value | float * (rgb_end[2] - rgb_start[2]) | int
                ]
              }}

        - target:
            entity_id: "{{ target_light.entity_id }}"
          data:
            brightness_pct: "{{ brightness_procent }}"
            rgb_color: "{{ rgb_value }}"
            transition: !input transition_time
          action: light.turn_on

        - variables:
            last_light_update: >-
              {{ [brightness_procent, rgb_value] }}

        - delay:
            hours: 0
            minutes: 0
            seconds: !input update_frequency
            milliseconds: 0
        - service: system_log.write
          data:
            message: >
              brightness: {{brightness_value}} timestamp:{{timestamp_value}} now:{{as_timestamp(now())}} progress:{{progress}} continue?:{{last_light_update ==
                [states[target_light.entity_id].attributes.brightness,
                states[target_light.entity_id].attributes.rgb_color]}}
            level: warning
    enabled: true

  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ last_light_update ==
              [states[target_light.entity_id].attributes.brightness,
              states[target_light.entity_id].attributes.rgb_color]}}
        sequence:
          - target:
              entity_id: "{{ target_light.entity_id }}"
            data:
              brightness_pct: |
                {{ max_brightness | int }}
              rgb_color: |
                {{rgb_end}}
              transition: !input transition_time
            action: light.turn_on

  - choose:
      - conditions: []
        sequence: !input post_alarm_actions

mode: single
